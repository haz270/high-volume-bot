name: High Volume Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write  # allows the workflow to commit CSV files

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt yfinance pandas numpy requests openpyxl gspread oauth2client twilio multitasking

      - name: Run the bot with debug logs
        run: |
          set -o pipefail
          python high_volume_bot.py | tee bot_logs.txt  # output printed live and saved to file

      - name: Commit CSV to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add *.csv
          git commit -m "Add CSV from bot run $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
